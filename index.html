<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>صيدلية المنورة</title>
<style>
:root{--green:#e7f1f8;--deep:#176b50;--blue:#315c9e;--ink:#243247;--muted:#788797;--paper:#fff;--bg:#f3f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#e8f3fa 0%,#f3f7fb 48%,#e6f1ed 100%);color:var(--ink);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:white}button:disabled{opacity:0.6;cursor:not-allowed}button.secondary{background:#edf1fb;color:#304d99}button.danger{background:#d94c4c}button.green{background:var(--deep)}input,textarea,select{width:100%;padding:11px;border:1px solid #dce2e8;border-radius:10px;background:white;margin:5px 0 10px}label{font-size:13px;color:#555;display:block}header{text-align:center;padding:20px 14px 10px;color:#24405d}
.contact-btn{display:inline-flex;align-items:center;justify-content:center;min-width:112px;padding:9px 18px;border-radius:12px;color:#fff;text-decoration:none;font-weight:bold;box-shadow:0 2px 5px #0002}
.contact-btn.whatsapp{background:#20a45b}
.contact-btn.call{background:#345db8}
h1{font-size:clamp(30px,7vw,56px);margin:0 0 18px;font-weight:800} .search{max-width:700px;margin:auto;background:white;border-radius:22px;padding:9px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 4px #0001}.search input{border:0;margin:0;flex:1}.search button{font-size:20px}.container{max-width:1100px;margin:20px auto;padding:0 14px 110px}.banner{position:relative;background:#fff;border-radius:18px;overflow:hidden;margin:18px 0;height:150px;display:none}.banner img{width:100%;height:100%;object-fit:cover}.banner .dots{position:absolute;bottom:8px;left:0;right:0;text-align:center}.dot{display:inline-block;background:#ffffffa8;width:8px;height:8px;border-radius:50%;margin:0 3px}.dot.active{background:white;width:20px}.section-title{color:#24405d;font-size:22px;margin:18px 4px}.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;padding:2px 0 12px}.chip{white-space:normal;background:#fff;color:#287c52;border-radius:16px;padding:8px 7px;display:flex;flex-direction:column;align-items:center;gap:6px}.chip img{width:66px;height:60px;object-fit:contain;border-radius:10px}.chip span{font-size:13px;text-align:center}.chip.active{background:#236e4a;color:#fff}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.product{background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 9px #174a2c15}.product img{width:100%;height:130px;object-fit:contain;border-radius:10px;background:#f6f8f7}.product h3{font-size:15px;margin:9px 0 5px}.price{font-weight:bold;color:#238352;margin:8px 0}.product button{width:100%;padding:9px}.empty{color:#65788a;text-align:center;padding:45px 10px}.nav{position:fixed;bottom:14px;left:3.5%;right:3.5%;max-width:850px;margin:auto;background:white;border-radius:28px;display:flex;justify-content:space-around;padding:12px 5px;box-shadow:0 4px 18px #0002;z-index:5}.nav button{background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 10px;font-size:12px}.nav button .ico{font-size:25px}.nav button.active{color:var(--deep);font-weight:bold}.panel{background:white;border-radius:18px;padding:16px;margin:12px 0}.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}.modalbox{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0 0 12px}.close{background:#eee;color:#333}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:#edf1fb;color:#304d99}.admin-list{border:1px solid #e6e8eb;border-radius:12px;padding:10px;margin:8px 0}.admin-list img{width:55px;height:55px;object-fit:cover;border-radius:8px}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf4ee;color:#21885b;font-size:12px}.stepper{display:flex;justify-content:space-between;gap:3px;margin:12px 0}.stepper span{font-size:11px;text-align:center;flex:1;padding:7px 3px;border-radius:8px;background:#eee;color:#777}.stepper span.done{background:#d8f1e2;color:#147848;font-weight:bold}@media(min-width:650px){.banner{height:210px}.products{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
</style>
</head>
<body>
<header>
<h1>صيدلية المنورة</h1>
<div class="search"><button class="secondary" id="filterBtn" title="الأقسام">☷</button><input id="searchInput" placeholder="بحث عن منتج"><button id="searchBtn">⌕</button></div>
</header>
<main class="container">
<div id="banner" class="banner"><img id="bannerImg" alt="إعلان"><div class="dots" id="bannerDots"></div></div>
<div id="homeView"><h2 class="section-title">الرئيسية</h2><div id="homeProducts" class="products"></div><div id="homeEmpty" class="empty">جاري تحميل المنتجات...</div></div>
<div id="categoriesView" class="hidden"><h2 class="section-title">الأقسام</h2><div id="categoryChips" class="chips"></div><div id="categoryProducts" class="products"></div><div id="categoryEmpty" class="empty hidden">لا توجد منتجات في هذا القسم</div></div>
<div id="addressView" class="hidden"><h2 class="section-title">العنوان</h2><div class="panel" style="text-align:center;line-height:2.1">
<h3>صيدليه المنورة للادوية و المستلزمات الطبيه</h3>
<p>🏥 المكلا - الديس - خلف ملعب بارادم</p>
<p>📱 778358110</p>
<div class="row" style="max-width:420px;margin:auto">
<a class="contact-btn whatsapp" href="https://wa.me/967778358110" target="_blank" rel="noopener">واتساب</a>
<a class="contact-btn call" href="tel:+967778358110">اتصال</a>
</div></div></div>
<div id="cartView" class="hidden"><h2 class="section-title">السلة</h2><div class="panel" id="cartContent"></div></div>
<div id="accountView" class="hidden"><h2 class="section-title">حسابي</h2><div class="panel" id="accountContent"></div></div>
<div id="ordersView" class="hidden"><h2 class="section-title">طلباتي</h2><div class="panel" id="ordersContent"></div></div>
</main>
<nav class="nav">
<button data-view="addressView"><span class="ico">🏥</span>العنوان</button><button data-view="categoriesView"><span class="ico">▦</span>أقسام</button><button data-view="homeView" class="active"><span class="ico">⌂</span>الرئيسية</button><button data-view="cartView"><span class="ico">🛒</span>السلة <span id="cartCount"></span></button><button data-view="accountView"><span class="ico">♙</span>حسابي</button>
</nav>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const defaultCategories=['أدوية','عناية بطفل','عناية بالأم','تجميل','أدوات طبية'];
let db={categories:[...defaultCategories],categoryImages:{},products:[],banners:[],customers:[],orders:[]};

function categoryArt(name){
 const shapes={
 'أدوية':'<rect x="28" y="28" width="64" height="24" rx="12" fill="#e85d75" transform="rotate(-35 60 40)"/><path d="M50 26l22 30" stroke="#fff" stroke-width="5" transform="rotate(-35 60 40)"/>',
 'عناية بطفل':'<circle cx="60" cy="43" r="25" fill="#ffd7b5"/><path d="M35 40Q35 10 60 15Q85 10 85 40" fill="#7c5a43"/><circle cx="51" cy="44" r="3"/><circle cx="69" cy="44" r="3"/><path d="M52 55q8 7 16 0" fill="none" stroke="#d77" stroke-width="3"/>',
 'عناية بالأم':'<circle cx="60" cy="34" r="19" fill="#ffd7b5"/><path d="M40 34Q38 10 60 12Q82 10 80 34" fill="#6b4b3e"/><path d="M28 92Q30 55 60 53Q90 55 92 92" fill="#e99bb7"/>',
 'تجميل':'<rect x="48" y="22" width="24" height="52" rx="5" fill="#e85d8a"/><rect x="52" y="12" width="16" height="15" rx="3" fill="#b33b67"/><rect x="42" y="73" width="36" height="12" rx="4" fill="#d9a4b7"/>',
 'أدوات طبية':'<path d="M50 18h20v27h27v20H70v27H50V65H23V45H50z" fill="#fff" stroke="#4c9ed9" stroke-width="3"/>'
 };
 let bg={'أدوية':'#fff0f2','عناية بطفل':'#fff4df','عناية بالأم':'#fceaf3','تجميل':'#fbeaf1','أدوات طبية':'#eaf5ff'}[name]||'#eff7f1';
 return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="110" viewBox="0 0 120 110"><rect width="120" height="110" rx="16" fill="${bg}"/>${shapes[name]||'<circle cx="60" cy="55" r="28" fill="#5ca675"/>'}</svg>`)
}

let user=JSON.parse(sessionStorage.getItem('manoraUser')||'null'),cart=JSON.parse(sessionStorage.getItem('manoraCart')||'[]'),view='homeView',selectedCategory=defaultCategories[0],bannerIndex=0;

async function loadCloudDB() {
  try {
    const res = await fetch('/api/db');
    if (res.ok) {
      const data = await res.json();
      db = { ...db, ...data };
      defaultCategories.forEach(c => {
        if (!db.categories.includes(c)) db.categories.push(c);
        if (!db.categoryImages[c]) db.categoryImages[c] = categoryArt(c);
      });
      if (!db.categories.includes(selectedCategory)) selectedCategory = db.categories[0] || '';
    }
  } catch (e) {
    console.error('فشل جلب البيانات:', e);
  }
  document.getElementById('homeEmpty').textContent = 'ستظهر هنا المنتجات التي يحددها المسؤول للرئيسية';
  render();
}

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function jsArg(s){return JSON.stringify(String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function selectCategory(c){selectedCategory=c;renderProducts()}
function imageSrc(src){return src||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180"><rect width="100%" height="100%" fill="#f0f5f1"/><text x="50%" y="50%" text-anchor="middle" fill="#8a9a8e" font-size="18">صورة المنتج</text></svg>')}
function showView(v){view=v;['homeView','categoriesView','addressView','cartView','accountView','ordersView'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==v));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
document.getElementById('filterBtn').onclick=()=>showView('categoriesView');
document.getElementById('searchBtn').onclick=()=>{renderProducts();showView('categoriesView')};
document.getElementById('searchInput').oninput=()=>{renderProducts();showView('categoriesView')};

function renderProducts(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  let list=db.products.filter(p=>p.name.toLowerCase().includes(q));
  const home=list.filter(p=>p.home);
  document.getElementById('homeProducts').innerHTML=home.map(productCard).join('');
  document.getElementById('homeEmpty').classList.toggle('hidden',home.length>0);
  document.getElementById('categoryChips').innerHTML=db.categories.map(c=>`<button class="chip ${c===selectedCategory?'active':''}" onclick="selectCategory(${jsArg(c)})"><img src="${imageSrc(db.categoryImages[c]||categoryArt(c))}" alt=""><span>${esc(c)}</span></button>`).join('');
  let cp=q?list:list.filter(p=>p.category===selectedCategory);
  document.getElementById('categoryProducts').innerHTML=cp.map(productCard).join('');
  document.getElementById('categoryEmpty').classList.toggle('hidden',cp.length>0);
  document.getElementById('categoryEmpty').textContent=q?'لا توجد منتجات تطابق البحث':'لا توجد منتجات في هذا القسم';
}
function productCard(p){return `<article class="product"><img src="${imageSrc(p.image)}" alt="${esc(p.name)}"><h3>${esc(p.name)}</h3><div class="price">${esc(p.price)} ريال</div><button onclick="addToCart('${p.id}')">＋ شراء</button></article>`}
function addToCart(id){if(!user){openModal('تسجيل الدخول مطلوب',authMarkup());authMode('login');return}let p=db.products.find(x=>x.id===id);if(p){let item=cart.find(x=>x.id===id);if(item)item.qty++;else cart.push({id,qty:1});sessionStorage.setItem('manoraCart',JSON.stringify(cart));renderCart();alert('تمت إضافة المنتج إلى السلة')}}
function renderCart(){document.getElementById('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0)||'';let el=document.getElementById('cartContent');if(!cart.length){el.innerHTML='<p>السلة فارغة حالياً</p>';return}el.innerHTML=cart.map(it=>{let p=db.products.find(x=>x.id===it.id);return p?`<div class="admin-list row"><img src="${imageSrc(p.image)}"><div><b>${esc(p.name)}</b><p>${esc(p.price)} ريال × ${it.qty}</p></div><button class="danger" onclick="removeCart('${p.id}')">حذف</button></div>`:''}).join('')+`<button class="green" onclick="checkout()">شراء المنتجات</button>`}
function removeCart(id){cart=cart.filter(x=>x.id!==id);sessionStorage.setItem('manoraCart',JSON.stringify(cart));renderCart()}
function authMarkup(){return `<div class="tabs"><button onclick="authMode('login')">دخول</button><button onclick="authMode('signup')">إنشاء حساب جديد</button></div><div id="authForm"></div>`}
function authMode(mode){let f=document.getElementById('authForm');if(!f)return;if(mode==='login')f.innerHTML=`<label>اسم المستخدم</label><input id="loginUser"><label>كلمة المرور</label><input id="loginPass" type="password"><button class="green" onclick="login()">دخول</button>`;else f.innerHTML=`<label>اسم العميل</label><input id="custName"><label>رقم جواله</label><input id="custPhone" type="tel"><label>اسم المستخدم</label><input id="newUser"><label>كلمة المرور</label><input id="newPass" type="password"><button id="signupBtn" class="green" onclick="signup()">حفظ</button>`}

async function login(){
  await loadCloudDB();
  let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;
  let c=db.customers.find(x=>x.username===u&&x.password===p);
  if(!c)return alert('اسم المستخدم أو كلمة المرور غير صحيحة');
  user={id:c.id,name:c.name,username:c.username,phone:c.phone};
  sessionStorage.setItem('manoraUser',JSON.stringify(user));
  closeModal();render();alert('تم تسجيل الدخول');
}

async function signup(){
  let name=document.getElementById('custName').value.trim(),phone=document.getElementById('custPhone').value.trim(),username=document.getElementById('newUser').value.trim(),password=document.getElementById('newPass').value;
  if(!name||!phone||!username||!password)return alert('يرجى تعبئة جميع البيانات');
  let btn=document.getElementById('signupBtn');btn.disabled=true;btn.textContent='جاري الحفظ...';
  let c={id:crypto.randomUUID(),name,phone,username,password,created:new Date().toLocaleString('ar')};
  try {
    const res = await fetch('/api/db', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ action: 'signup', payload: c })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'تعذر إنشاء الحساب');
    db.customers.push(c);
    user={id:c.id,name,username,phone};
    sessionStorage.setItem('manoraUser',JSON.stringify(user));
    closeModal();render();alert('تم إنشاء الحساب، يمكنك التسوق الآن');
  } catch (e) {
    alert(e.message);
    btn.disabled=false;btn.textContent='حفظ';
  }
}

function renderAccount(){let el=document.getElementById('accountContent');el.innerHTML=user?`<h3>مرحباً ${esc(user.name)}</h3><p>اسم المستخدم: ${esc(user.username)}</p><p>رقم الجوال: ${esc(user.phone)}</p><button onclick="showView('ordersView')">طلباتي</button> <button class="secondary" onclick="logout()">خروج</button>`:authMarkup();if(!user)authMode('login')}
function logout(){user=null;sessionStorage.removeItem('manoraUser');renderAccount()}
function checkout(){if(!user){openModal('تسجيل الدخول مطلوب',authMarkup());authMode('login');return}openModal('إتمام الطلب',`<div id="checkoutItems">${cart.map(it=>{let p=db.products.find(x=>x.id===it.id);return p?`<p>${esc(p.name)} × ${it.qty}</p>`:''}).join('')}</div><label>سند الإيداع (رقم/مرجع السند)</label><input id="deposit" placeholder="أدخل سند الإيداع"><label>موقع العميل</label><textarea id="location" placeholder="المدينة / الحي / العنوان"></textarea><label>رقم الجوال</label><input id="orderPhone" value="${esc(user.phone)}" type="tel"><button id="orderBtn" class="green" onclick="submitOrder()">إرسال الطلب</button>`)}

async function submitOrder(){
  let deposit=document.getElementById('deposit').value.trim(),location=document.getElementById('location').value.trim(),phone=document.getElementById('orderPhone').value.trim();
  if(!deposit||!location||!phone)return alert('أدخل سند الإيداع والموقع ورقم الجوال');
  let btn=document.getElementById('orderBtn');btn.disabled=true;btn.textContent='جاري إرسال الطلب...';
  let order={id:'ORD-'+Date.now().toString().slice(-7),customerId:user.id,customerName:user.name,username:user.username,phone,location,deposit,items:cart.map(it=>{let p=db.products.find(x=>x.id===it.id);return {name:p?.name||'منتج',price:p?.price||0,qty:it.qty}}),status:'تم الطلب',created:new Date().toLocaleString('ar'),history:['تم الطلب']};
  try {
    const res = await fetch('/api/db', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ action: 'newOrder', payload: order })
    });
    if (!res.ok) throw new Error('فشل إرسال الطلب');
    db.orders.push(order);
    cart=[];sessionStorage.setItem('manoraCart','[]');
    closeModal();showView('ordersView');alert('تم إرسال الطلب بنجاح');
  } catch (e) {
    alert(e.message);
    btn.disabled=false;btn.textContent='إرسال الطلب';
  }
}

const statuses=['تم الطلب','مراجعة','تم التنفيذ','تم إرسال الطلب','تم الاستلام'];
function renderOrders(){let list=db.orders.filter(o=>user&&o.customerId===user.id);document.getElementById('ordersContent').innerHTML=list.length?list.map(o=>`<div class="admin-list"><b>طلب ${esc(o.id)}</b><p>${esc(o.created)} · <span class="status">${esc(o.status)}</span></p><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join('، ')}</p><div class="stepper">${statuses.map(s=>`<span class="${statuses.indexOf(s)<=statuses.indexOf(o.status)?'done':''}">${esc(s)}</span>`).join('')}</div></div>`).join(''):'لا توجد طلبات حتى الآن'}
function render(){renderProducts();renderCart();renderAccount();renderOrders();document.getElementById('banner').style.display=db.banners.length?'block':'none';if(db.banners.length){bannerIndex%=db.banners.length;document.getElementById('bannerImg').src=imageSrc(db.banners[bannerIndex].image);document.getElementById('bannerDots').innerHTML=db.banners.map((x,i)=>`<span class="dot ${i===bannerIndex?'active':''}"></span>`).join('')}}
setInterval(()=>{if(db.banners.length){bannerIndex=(bannerIndex+1)%db.banners.length;document.getElementById('bannerImg').src=imageSrc(db.banners[bannerIndex].image);document.getElementById('bannerDots').innerHTML=db.banners.map((x,i)=>`<span class="dot ${i===bannerIndex?'active':''}"></span>`).join('')}},3500);
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

loadCloudDB();
</script>
</body>
</html>
