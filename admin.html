<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم - صيدلية المنورة</title>
<style>
:root{--deep:#176b50;--blue:#315c9e;--ink:#243247;--bg:#f3f7fb}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#e8f3fa 0%,#f3f7fb 48%,#e6f1ed 100%);color:var(--ink);min-height:100vh;padding:16px}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--blue);color:white}
button:disabled{opacity:0.6;cursor:not-allowed}
button.secondary{background:#edf1fb;color:#304d99}
button.danger{background:#d94c4c}
button.green{background:var(--deep)}
input,textarea,select{width:100%;padding:11px;border:1px solid #dce2e8;border-radius:10px;background:white;margin:5px 0 12px}
label{font-size:13px;color:#555;display:block}
.container{max-width:850px;margin:20px auto}
.login-box{max-width:400px;margin:80px auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 4px 18px #0001}
.panel{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 18px #0001}
.header-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;border-bottom:1px solid #eee;padding-bottom:12px}
.header-bar h2{margin:0;color:#24405d}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{background:#edf1fb;color:#304d99}
.tabs button.active{background:var(--blue);color:white}
.admin-list{border:1px solid #e6e8eb;border-radius:12px;padding:12px;margin:10px 0}
.admin-list img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.status{display:inline-block;padding:5px 10px;border-radius:20px;background:#eaf4ee;color:#21885b;font-size:12px;font-weight:bold}
.hidden{display:none!important}
.sync-badge{font-size:12px;color:#176b50;background:#eaf4ee;padding:4px 10px;border-radius:12px}
.receipt-box{margin:8px 0;padding:8px;background:#f8fafc;border-radius:10px;border:1px dashed #cbd5e1;display:inline-block}
</style>
</head>
<body>

<div id="loginBox" class="login-box">
  <h2 style="margin-top:0;text-align:center;color:#24405d">دخول لوحة التحكم</h2>
  <label>كلمة المرور</label>
  <input id="adminPass" type="password" placeholder="أدخل كلمة المرور" onkeydown="if(event.key==='Enter')checkAdmin()">
  <button id="loginBtn" class="green" style="width:100%" onclick="checkAdmin()">تسجيل الدخول</button>
</div>

<div id="adminDashboard" class="container hidden">
  <div class="panel">
    <div class="header-bar">
      <div>
        <h2>لوحة تحكم صيدلية المنورة</h2>
        <span id="syncStatus" class="sync-badge">متصل بالسحابة ✓</span>
      </div>
      <div>
        <button class="secondary" onclick="refreshData()">تحديث البيانات ↻</button>
        <a href="index.html" target="_blank" style="text-decoration:none;margin:0 6px"><button class="secondary">عرض المتجر ↗</button></a>
        <button class="danger" onclick="adminLogout()">خروج</button>
      </div>
    </div>

    <div class="tabs" id="adminTabs">
      <button data-tab="products" onclick="adminSection('products')">المنتجات</button>
      <button data-tab="categories" onclick="adminSection('categories')">الأقسام</button>
      <button data-tab="banners" onclick="adminSection('banners')">صور الإعلان</button>
      <button data-tab="customers" onclick="adminSection('customers')">العملاء</button>
      <button data-tab="orders" onclick="adminSection('orders')">الطلبات</button>
      <button data-tab="password" onclick="adminSection('password')">كلمة المرور</button>
    </div>

    <div id="adminContent"></div>
  </div>
</div>

<script>
const statuses = ['تم الطلب','مراجعة','تم التنفيذ','تم إرسال الطلب','تم الاستلام'];
let db = null;
let currentAuthPass = sessionStorage.getItem('manoraAdminPass') || '';
let activeTab = 'products';

function setSync(text, busy = false) {
  const el = document.getElementById('syncStatus');
  if (el) {
    el.textContent = text;
    el.style.background = busy ? '#fff3cd' : '#eaf4ee';
    el.style.color = busy ? '#856404' : '#176b50';
  }
}

async function fetchCloudDB() {
  const res = await fetch('/api/db?admin=1');
  if (!res.ok) {
    const errText = await res.text();
    throw new Error('خطأ من السيرفر (' + res.status + '): ' + errText.slice(0, 100));
  }
  db = await res.json();
}

async function saveCloudDB(newPassword = null) {
  setSync('جاري الحفظ في السحابة...', true);
  const payload = {
    ...db,
    adminPassword: newPassword || db.adminPassword,
    authPassword: currentAuthPass
  };
  const res = await fetch('/api/db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'saveAdminDB', payload })
  });
  const data = await res.json();
  if (!res.ok) {
    setSync('فشل الحفظ!', true);
    throw new Error(data.error || 'فشل الحفظ');
  }
  if (newPassword) {
    db.adminPassword = newPassword;
    currentAuthPass = newPassword;
    sessionStorage.setItem('manoraAdminPass', newPassword);
  }
  setSync('تم الحفظ في السحابة ✓');
}

async function uploadImageToBlob(input) {
  const f = input.files[0];
  if (!f) return '';
  if (f.size > 4 * 1024 * 1024) throw new Error('حجم الصورة يجب أن يكون أقل من 4 ميجابايت');
  
  setSync('جاري رفع الصورة...', true);
  const base64 = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(f);
  });

  const res = await fetch('/api/db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'uploadImage', payload: { base64, filename: f.name } })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'فشل رفع الصورة');
  return data.url;
}

async function checkAdmin() {
  const inputPass = document.getElementById('adminPass').value;
  if (!inputPass) return alert('أدخل كلمة المرور');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'جاري التحقق...';
  
  try {
    await fetchCloudDB();
    if (inputPass !== db.adminPassword) {
      btn.disabled = false; btn.textContent = 'تسجيل الدخول';
      return alert('كلمة المرور غير صحيحة');
    }
    currentAuthPass = inputPass;
    sessionStorage.setItem('manoraAdminPass', inputPass);
    showDashboard();
  } catch (e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'تسجيل الدخول';
  }
}

function showDashboard() {
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminDashboard').classList.remove('hidden');
  adminSection(activeTab);
}

async function refreshData() {
  setSync('جاري التحديث...', true);
  await fetchCloudDB();
  adminSection(activeTab);
  setSync('متصل بالسحابة ✓');
}

function adminLogout() {
  sessionStorage.removeItem('manoraAdminPass');
  location.reload();
}

(async function init() {
  if (currentAuthPass) {
    try {
      await fetchCloudDB();
      if (currentAuthPass === db.adminPassword) {
        showDashboard();
      } else {
        sessionStorage.removeItem('manoraAdminPass');
      }
    } catch (e) { console.error(e); }
  }
})();

function esc(s='') { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsArg(s) { return JSON.stringify(String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function imageSrc(src) { return src || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180"><rect width="100%" height="100%" fill="#f0f5f1"/><text x="50%" y="50%" text-anchor="middle" fill="#8a9a8e" font-size="18">صورة</text></svg>'); }

function adminSection(tab) {
  activeTab = tab;
  document.querySelectorAll('#adminTabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  let el = document.getElementById('adminContent');
  if(!el || !db) return;

  if(tab === 'products') {
    el.innerHTML = `
      <h3>إضافة / تعديل منتج</h3>
      <input id="pId" type="hidden">
      <label>اسم المنتج</label><input id="pName">
      <label>القسم</label><select id="pCategory">${db.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
      <label>السعر</label><input id="pPrice" type="number" min="0">
      <label>صورة المنتج</label><input id="pImageFile" type="file" accept="image/*">
      <label>أو رابط الصورة</label><input id="pImageUrl">
      <label><input id="pHome" type="checkbox" style="width:auto"> عرض المنتج في الرئيسية</label>
      <button id="saveProdBtn" class="green" onclick="saveProduct()">حفظ المنتج</button>
      <hr>
      ${db.products.map(p=>`<div class="admin-list row"><img src="${imageSrc(p.image)}"><div><b>${esc(p.name)}</b><p>${esc(p.price)} ريال ${p.home?' · الرئيسية':''}</p></div><button class="secondary" onclick="editProduct('${p.id}')">تعديل</button><button class="danger" onclick="deleteProduct('${p.id}')">حذف</button></div>`).join('')}
    `;
  }

  if(tab === 'categories') {
    el.innerHTML = `
      <h3>إدارة الأقسام</h3>
      <label>اسم القسم الجديد</label><input id="catNew" placeholder="اسم القسم">
      <label>صورة القسم (مطلوبة عند الإضافة)</label><input id="catImageFile" type="file" accept="image/*" required>
      <button id="addCatBtn" class="green" onclick="addCategory()">إضافة قسم مع صورة</button>
      ${db.categories.map(c=>`<div class="admin-list row"><img src="${imageSrc(db.categoryImages[c])}" alt="صورة القسم"><b>${esc(c)}</b><button class="secondary" onclick="changeCategoryImage(${jsArg(c)})">تغيير الصورة</button><button class="secondary" onclick="renameCategory(${jsArg(c)})">تعديل الاسم</button><button class="danger" onclick="deleteCategory(${jsArg(c)})">حذف</button></div>`).join('')}
    `;
  }

  if(tab === 'banners') {
    el.innerHTML = `
      <h3>إعلانات متحركة (حتى 3 صور)</h3>
      <label>صورة الإعلان</label><input id="bannerFile" type="file" accept="image/*">
      <label>أو رابط الصورة</label><input id="bannerUrl">
      <button id="addBannerBtn" class="green" onclick="addBanner()">إضافة إعلان</button>
      ${db.banners.map((b,i)=>`<div class="admin-list row"><img src="${imageSrc(b.image)}"><b>الإعلان ${i+1}</b><button class="danger" onclick="deleteBanner(${i})">حذف</button></div>`).join('')}
    `;
  }

  if(tab === 'customers') {
    el.innerHTML = `<h3>بيانات العملاء (${db.customers.length})</h3>` + 
      (db.customers.map(c=>`
        <div class="admin-list row">
          <div style="flex:3">
            <b>${esc(c.name)}</b>
            <p style="margin:4px 0">جوال: ${esc(c.phone)} · اسم المستخدم: <b>${esc(c.username)}</b></p>
            <small style="color:#777">تاريخ التسجيل: ${esc(c.created||'')}</small>
          </div>
          <button class="danger" style="flex:0 0 auto" onclick="deleteCustomer(${jsArg(c.username)})">حذف العميل</button>
        </div>
      `).join('') || 'لا يوجد عملاء');
  }

  if(tab === 'orders') {
    el.innerHTML = `<h3>الطلبات (${db.orders.length})</h3>` + 
      (db.orders.map(o=>`
        <div class="admin-list">
          <b>${esc(o.id)} — ${esc(o.customerName)}</b>
          <p>جوال: ${esc(o.phone)} | الموقع: ${esc(o.location)}</p>
          ${o.deposit && o.deposit.startsWith('http') 
            ? `<div class="receipt-box">
                 <div style="font-size:12px;margin-bottom:4px;color:#176b50;font-weight:bold">صورة سند الإيداع (اضغط للتكبير):</div>
                 <a href="${esc(o.deposit)}" target="_blank"><img src="${esc(o.deposit)}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid #ccc"></a>
               </div>`
            : `<p>سند الإيداع: ${esc(o.deposit || 'غير مرفق')}</p>`
          }
          <p><b>المنتجات:</b> ${o.items.map(i=>esc(i.name)+' × '+i.qty).join('، ')}</p>
          <div class="row">
            <span class="status">${esc(o.status)}</span>
            <select id="status-${o.id}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
            <button class="green" onclick="updateOrder('${o.id}')">تحديث الحالة</button>
          </div>
        </div>
      `).join('') || 'لا توجد طلبات');
  }

  if(tab === 'password') {
    el.innerHTML = `
      <h3>تغيير كلمة مرور لوحة التحكم</h3>
      <label>كلمة المرور الحالية</label>
      <input id="oldAdminPass" type="password" placeholder="أدخل كلمة المرور الحالية">
      <label>كلمة المرور الجديدة</label>
      <input id="newAdminPass" type="password" placeholder="أدخل كلمة المرور الجديدة">
      <label>تأكيد كلمة المرور الجديدة</label>
      <input id="confirmAdminPass" type="password" placeholder="أعد إدخال كلمة المرور الجديدة">
      <button id="savePassBtn" class="green" onclick="changeAdminPassword()">حفظ كلمة المرور في السحابة</button>
    `;
  }
}

async function deleteCustomer(username) {
  if(!confirm('هل أنت متأكد من حذف حساب هذا العميل نهائياً؟')) return;
  try {
    db.customers = db.customers.filter(c => c.username !== username);
    await saveCloudDB();
    adminSection('customers');
    alert('تم حذف العميل من السحابة بنجاح');
  } catch(e) {
    alert(e.message);
  }
}

async function changeAdminPassword() {
  const oldP = document.getElementById('oldAdminPass').value;
  const newP = document.getElementById('newAdminPass').value.trim();
  const confP = document.getElementById('confirmAdminPass').value.trim();

  if(oldP !== db.adminPassword) return alert('كلمة المرور الحالية غير صحيحة');
  if(!newP || newP.length < 4) return alert('يرجى إدخال كلمة مرور جديدة لا تقل عن 4 أحرف');
  if(newP !== confP) return alert('كلمة المرور الجديدة وتأكيدها غير متطابقين');

  const btn = document.getElementById('savePassBtn');
  btn.disabled = true; btn.textContent = 'جاري الحفظ...';
  try {
    await saveCloudDB(newP);
    alert('تم تغيير كلمة المرور وحفظها في السحابة بنجاح');
    adminSection('password');
  } catch(e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'حفظ كلمة المرور في السحابة';
  }
}

async function saveProduct() {
  const btn = document.getElementById('saveProdBtn');
  try {
    let id = document.getElementById('pId').value;
    let name = document.getElementById('pName').value.trim();
    let category = document.getElementById('pCategory').value;
    let price = document.getElementById('pPrice').value;
    if(!name || price === '') return alert('أدخل اسم المنتج والسعر');
    
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';
    let image = await uploadImageToBlob(document.getElementById('pImageFile'));
    image = image || document.getElementById('pImageUrl').value.trim() || (id ? db.products.find(p=>p.id===id)?.image : '');
    
    let obj = {id: id || crypto.randomUUID(), name, category, price: Number(price), image, home: document.getElementById('pHome').checked};
    let idx = db.products.findIndex(p => p.id === obj.id);
    if(idx >= 0) db.products[idx] = obj;
    else db.products.push(obj);
    
    await saveCloudDB();
    adminSection('products');
    alert('تم حفظ المنتج');
  } catch(e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'حفظ المنتج';
  }
}

function editProduct(id) {
  let p = db.products.find(x => x.id === id);
  adminSection('products');
  document.getElementById('pId').value = p.id;
  document.getElementById('pName').value = p.name;
  document.getElementById('pCategory').value = p.category;
  document.getElementById('pPrice').value = p.price;
  document.getElementById('pHome').checked = p.home;
  document.getElementById('pImageUrl').value = p.image || '';
}

async function deleteProduct(id) {
  if(confirm('حذف المنتج؟')) {
    db.products = db.products.filter(p => p.id !== id);
    await saveCloudDB();
    adminSection('products');
  }
}

async function addCategory() {
  let c = document.getElementById('catNew').value.trim();
  if(!c) return alert('أدخل اسم القسم');
  if(db.categories.includes(c)) return alert('القسم موجود');
  const btn = document.getElementById('addCatBtn');
  try {
    btn.disabled = true; btn.textContent = 'جاري الرفع...';
    let image = await uploadImageToBlob(document.getElementById('catImageFile'));
    if(!image) { btn.disabled = false; btn.textContent = 'إضافة قسم مع صورة'; return alert('يرجى اختيار صورة للقسم الجديد'); }
    db.categories.push(c);
    db.categoryImages[c] = image;
    await saveCloudDB();
    adminSection('categories');
  } catch(e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'إضافة قسم مع صورة';
  }
}

async function changeCategoryImage(c) {
  let input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async () => {
    try {
      let image = await uploadImageToBlob(input);
      if(!image) return;
      db.categoryImages[c] = image;
      await saveCloudDB();
      adminSection('categories');
    } catch(e) { alert(e.message); }
  };
  input.click();
}

async function renameCategory(old) {
  let n = prompt('اسم القسم الجديد', old);
  if(!n || !n.trim()) return;
  n = n.trim();
  db.categories = db.categories.map(c => c === old ? n : c);
  db.categoryImages[n] = db.categoryImages[old];
  delete db.categoryImages[old];
  db.products.forEach(p => { if(p.category === old) p.category = n; });
  await saveCloudDB();
  adminSection('categories');
}

async function deleteCategory(c) {
  if(!confirm('حذف القسم؟')) return;
  db.categories = db.categories.filter(x => x !== c);
  delete db.categoryImages[c];
  db.products.forEach(p => { if(p.category === c) p.category = ''; });
  await saveCloudDB();
  adminSection('categories');
}

async function addBanner() {
  if(db.banners.length >= 3) return alert('الحد الأقصى 3 إعلانات');
  const btn = document.getElementById('addBannerBtn');
  try {
    btn.disabled = true; btn.textContent = 'جاري الرفع...';
    let image = await uploadImageToBlob(document.getElementById('bannerFile'));
    image = image || document.getElementById('bannerUrl').value.trim();
    if(!image) { btn.disabled = false; btn.textContent = 'إضافة إعلان'; return alert('اختر صورة أو أدخل رابطها'); }
    db.banners.push({image});
    await saveCloudDB();
    adminSection('banners');
  } catch(e) {
    alert(e.message);
    btn.disabled = false; btn.textContent = 'إضافة إعلان';
  }
}

async function deleteBanner(i) {
  db.banners.splice(i, 1);
  await saveCloudDB();
  adminSection('banners');
}

async function updateOrder(id) {
  let o = db.orders.find(x => x.id === id);
  let s = document.getElementById('status-' + id).value;
  if(o) {
    o.status = s;
    o.history.push(s);
    await saveCloudDB();
    adminSection('orders');
    alert('تم تحديث حالة الطلب');
  }
}
</script>
</body>
</html>
